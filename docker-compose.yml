name: tkcrm

services:
  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: tkcrm-dev:latest
    container_name: tkcrm-app
    working_dir: /app
    env_file: .env
    environment:
      OCTANE_SERVER: frankenphp
    ports:
      - "${APP_PORT:-8780}:${APP_PORT:-8780}"
    volumes:
      - ./:/app
    command: ["sh", "-c", "[ -d vendor ] || composer install --no-interaction --prefer-dist; php artisan octane:frankenphp --caddyfile=docker/Caddyfile --host=0.0.0.0 --port=${APP_PORT:-8780} --watch --workers=1 --max-requests=500"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${APP_PORT:-8780}/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    tty: true

  vite:
    image: tkcrm-dev:latest
    depends_on:
      - app
    container_name: tkcrm-vite
    working_dir: /app
    env_file: .env
    ports:
      - "${VITE_PORT:-5780}:${VITE_PORT:-5780}"
    volumes:
      - ./:/app
    command: ["sh", "-c", "[ -d node_modules ] || npm install; npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5780}"]
    restart: unless-stopped
    tty: true
    # Its own check: the image's default polls Caddy's metrics port, which only the app container runs.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:$${VITE_PORT:-5780}/@vite/client"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Runs the queue (outgoing mail) and the schedule (recurring billing, reminders, site pings, pruning).
  # Off unless asked for, so a dev site never bills, mails or pings on a timer:
  #   docker compose --profile worker up -d
  # Without it queued mail waits in the jobs table.
  worker:
    profiles: ["worker"]
    image: tkcrm-dev:latest
    depends_on:
      app:
        condition: service_healthy
    container_name: tkcrm-worker
    working_dir: /app
    env_file: .env
    volumes:
      - ./:/app
    # queue:listen boots the app for every job, so it picks up code changes. Either process ending stops the container.
    command: ["bash", "-c", "php artisan queue:listen --tries=3 & php artisan schedule:work & wait -n"]
    restart: unless-stopped
    # No HTTP server here, so the image's default check (Caddy's metrics port) would always fail.
    healthcheck:
      disable: true

  # Catches all outgoing mail. Web UI on MAILPIT_PORT; the app sends to mailpit:1025 inside the network.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tkcrm-mailpit
    ports:
      - "${MAILPIT_PORT:-8781}:8025"
    restart: unless-stopped
